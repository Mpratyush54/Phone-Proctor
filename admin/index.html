<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Phone-Proctor Console</title>
    <style>
      body { font-family: ui-sans-serif, system-ui; margin: 0; background: #0b1220; color: #e8eefc; }
      header { padding: 12px 20px; background: #111a2e; display: flex; gap: 16px; align-items: center; }
      a { color: #8cb4ff; }
      main { padding: 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      .cell { background: #16233d; padding: 12px; border-radius: 8px; }
      button { background: #2c5bea; color: white; border: 0; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
      input, textarea { background: #0b1220; color: #e8eefc; border: 1px solid #334; padding: 6px; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
