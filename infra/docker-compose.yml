services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proctor
      POSTGRES_PASSWORD: proctor
      POSTGRES_DB: proctor
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../server/migrations:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  oidc:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports: ["5556:5556"]
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]
    profiles: ["g"]

volumes:
  pgdata:
